plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.termixterminal'
version = '0.1.0'

android {
  namespace "expo.modules.termixterminal"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // libghostty-vt is only built for arm64-v8a and x86_64; build only the
    // ones the app asks for (reactNativeArchitectures).
    ndk {
      def wanted = (rootProject.findProperty("reactNativeArchitectures") ?: "arm64-v8a,x86_64")
        .toString().split(",").collect { it.trim() }
      def abis = ["arm64-v8a", "x86_64"].findAll { wanted.contains(it) }
      abiFilters(*(abis ?: ["arm64-v8a", "x86_64"]))
    }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_static"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  sourceSets {
    main {
      // Symbols Nerd Font Mono, the fallback for private use glyphs.
      assets.srcDirs += "vendor/fonts"
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(':termix-pipe')
  testImplementation 'junit:junit:4.13.2'
}
